[project]
name = "RootTrace"
version = "0.1.0"
description = "Autonomous AI-driven incident investigation platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]